name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install "pytest>=8.3,<10" "pytest-asyncio>=1,<2" "ruff>=0.13,<1"
      - name: Lint
        run: ruff check app migrations tests
      - name: Test
        env:
          AUTH_SECRET_KEY: ci-only-feature-flag-platform-secret-32-chars
          CORS_ORIGINS: http://localhost:3000
        run: pytest -q
      - name: Compile
        run: python -m compileall app tests
      - name: Migration heads
        run: alembic heads
